on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month

name: Update robots.txt from ai.robots.txt

jobs:
  update-robots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest AI crawler blocklist
        run: |
          curl -sSfL https://raw.githubusercontent.com/ai-robots-txt/ai.robots.txt/main/robots.txt -o upstream.txt
          # Guard against an empty or malformed download wiping the file
          grep -q '^User-agent:' upstream.txt && grep -q '^Disallow: /' upstream.txt
          {
            echo "# AI crawler blocklist from https://github.com/ai-robots-txt/ai.robots.txt"
            echo "# Updated automatically by .github/workflows/update-robots.yml - do not edit by hand"
            echo
            cat upstream.txt
            echo
            echo "# Everyone else (e.g. regular search engines) may crawl the site"
            echo "User-agent: *"
            echo "Allow: /"
          } > robots.txt
          rm upstream.txt

      - name: Commit changes and republish site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- robots.txt; then
            echo "robots.txt is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robots.txt
          git commit -m "Update robots.txt from ai.robots.txt"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the publish run explicitly
          gh workflow run publish.yml --ref master
